[package]
name = "udeler-auth-webview"
version = "4.0.0"
edition = "2021"
authors = ["M3rcena"]
description = "One-shot browser authentication helper for Udemy login"

[dependencies]
udeler-core = { path = "../udeler-core" }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "process", "fs", "net"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
directories = "6.0"