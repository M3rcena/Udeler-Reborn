[package]
name = "udeler-ui"
version = "4.0.0"
edition = "2021"
authors = ["M3rcena"]
description = "Native desktop GUI application for Udeler built with Slint and Rust"

[dependencies]
slint = "1.9"
udeler-core = { path = "../udeler-core" }
udeler-downloader = { path = "../udeler-downloader" }
udeler-auth-webview = { path = "../udeler-auth-webview" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
directories = "6.0"
open = "5.4.5"
serde_json = "1.0.154"
arboard = "3.4"

[build-dependencies]
slint-build = "1.9"
