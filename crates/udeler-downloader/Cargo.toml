[package]
name = "udeler-downloader"
version = "4.0.0"
edition = "2021"
authors = ["M3rcena"]
description = "High performance async chunked downloader with resume, throttle, and queue management"

[dependencies]
udeler-core = { path = "../udeler-core" }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
