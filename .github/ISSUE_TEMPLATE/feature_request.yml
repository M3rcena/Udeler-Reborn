name: 💡 Feature Request
description: Propose a new feature or UX enhancement.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Context
      description: What problem or missing workflow are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Describe the UX or technical implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
