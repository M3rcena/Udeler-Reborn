name: Automated Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build App Binaries
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Remove local .npmrc to prevent mirror overrides in CI
        shell: bash
        run: |
          rm -f .npmrc

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
          sudo snap install snapcraft --classic

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Compile Frontend & Main Source
        run: |
          npm run typecheck
          npx electron-vite build

      - name: Package App Binaries
        shell: bash
        run: |
          npx electron-builder --publish never \
            -c.appx.identityName="${{ secrets.MS_APPX_IDENTITY_NAME }}" \
            -c.appx.publisherDisplayName="${{ secrets.MS_APPX_PUBLISHER_DISPLAY_NAME }}" \
            -c.appx.publisher="${{ secrets.MS_APPX_PUBLISHER_ID }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.appx
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
            dist/*.tar.gz
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore

  publish:
    name: Publish Unified Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Single GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
